name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Diagnose settingsMerge (temp)
        run: |
          echo "=== vite transformWithEsbuild 转换 apply-claude-settings.js ==="
          node --input-type=module -e "
            import { transformWithEsbuild } from 'vite';
            import fs from 'node:fs';
            const code = fs.readFileSync('install/apply-claude-settings.js','utf8');
            try {
              await transformWithEsbuild(code, 'install/apply-claude-settings.js', { loader: 'js' });
              console.log('apply-claude-settings.js transformWithEsbuild OK');
            } catch (e) {
              console.log('apply-claude-settings.js transformWithEsbuild ERROR:');
              console.log('message:', e.message);
              console.log('errors:', JSON.stringify(e.errors ?? e, null, 2));
            }
          " 2>&1 || true
          echo "=== vitest 带完整堆栈跑 settingsMerge ==="
          NODE_OPTIONS="--stack-trace-limit=100" npx vitest run test/settingsMerge.test.ts --reporter=basic --no-file-parallelism 2>&1 || true

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
