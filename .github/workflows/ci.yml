name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Diagnose settingsMerge (temp)
        run: |
          echo "=== vite createServer + ssrLoadModule 完整加载 settingsMerge.test.ts ==="
          node --input-type=module -e "
            import { createServer } from 'vite';
            import path from 'node:path';
            try {
              const server = await createServer({ server: { middlewareMode: true }, appType: 'custom', logLevel: 'error' });
              const url = path.resolve('test/settingsMerge.test.ts');
              await server.ssrLoadModule(url);
              console.log('ssrLoadModule OK');
              await server.close();
            } catch (e) {
              console.log('ssrLoadModule ERROR:');
              console.log('name:', e?.name);
              console.log('message:', e?.message);
              console.log('stack:', e?.stack);
              console.log('id:', e?.id);
            }
          " 2>&1 || true

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
