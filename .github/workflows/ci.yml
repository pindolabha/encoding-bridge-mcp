name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          # npm 11.19 blocks install scripts unless approved; esbuild (vitest's
          # transformer) and sharp (native module) need theirs to run on CI.
          npm install-scripts approve esbuild sharp 2>/dev/null || true
          npm ci

      - name: Type check
        run: npm run check

      - name: Diagnose settingsMerge full error (temp, windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cat > /tmp/diag.mjs <<'EOF'
          import { createServer } from 'vite';
          import path from 'node:path';
          import fs from 'node:fs';
          const server = await createServer({
            server: { middlewareMode: true },
            appType: 'custom',
            logLevel: 'silent',
            optimizeDeps: { noDiscovery: true },
          });
          const id = path.resolve('test/settingsMerge.test.ts');
          try {
            // Reproduce exactly what vitest does: load the test module through vite.
            await server.ssrLoadModule(id);
            console.log('[diag] ssrLoadModule OK');
          } catch (e) {
            console.log('[diag] name:', e?.name);
            console.log('[diag] message:', e?.message);
            console.log('[diag] id:', e?.id);
            console.log('[diag] frame:', JSON.stringify(e?.frame ?? null));
            console.log('[diag] plugin:', e?.plugin);
            console.log('[diag] errors:', JSON.stringify(e?.errors ?? null, null, 2));
            console.log('[diag] stack:', e?.stack);
            // esbuild transform error details
            const code = fs.readFileSync(id, 'utf8');
            const { transformWithEsbuild } = await import('vite');
            try {
              await transformWithEsbuild(code, id, { loader: 'ts' });
              console.log('[diag] transformWithEsbuild(test) OK');
            } catch (te) {
              console.log('[diag] transformWithEsbuild(test) ERR:', JSON.stringify(te?.errors ?? te, null, 2));
            }
            const jsCode = fs.readFileSync('install/apply-claude-settings.js', 'utf8');
            try {
              await transformWithEsbuild(jsCode, 'install/apply-claude-settings.js', { loader: 'js' });
              console.log('[diag] transformWithEsbuild(apply-claude-settings.js) OK');
            } catch (te) {
              console.log('[diag] transformWithEsbuild(apply-claude-settings.js) ERR:', JSON.stringify(te?.errors ?? te, null, 2));
            }
            process.exit(1);
          }
          await server.close();
          EOF
          node /tmp/diag.mjs 2>&1 || true

      - name: Build
        run: npm run build
