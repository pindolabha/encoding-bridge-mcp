name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Diagnose settingsMerge (temp)
        run: |
          echo "=== vite transformWithEsbuild 转换 settingsMerge.test.ts ==="
          node --input-type=module -e "
            import { transformWithEsbuild } from 'vite';
            import fs from 'node:fs';
            const code = fs.readFileSync('test/settingsMerge.test.ts','utf8');
            try {
              await transformWithEsbuild(code, 'test/settingsMerge.test.ts', { loader: 'ts' });
              console.log('transformWithEsbuild OK');
            } catch (e) {
              console.log('transformWithEsbuild ERROR:');
              console.log('message:', e.message);
              console.log('errors:', JSON.stringify(e.errors ?? e, null, 2));
              console.log('stack:', e.stack);
            }
          " 2>&1 || true
          echo "=== esbuild 直接转换 settingsMerge.test.ts ==="
          node -e "
            const esbuild = require('esbuild');
            const fs = require('fs');
            const code = fs.readFileSync('test/settingsMerge.test.ts','utf8');
            try {
              const r = esbuild.transformSync(code, { loader: 'ts', format: 'esm' });
              console.log('esbuild transform OK, len', r.code.length);
            } catch(e) {
              console.log('esbuild transform ERROR:');
              console.log(e.message);
              console.log(JSON.stringify(e.errors, null, 2));
            }
          " 2>&1 || true

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
